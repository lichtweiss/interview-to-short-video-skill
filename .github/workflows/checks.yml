name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          TEST_FONT_FAMILY: Noto Sans CJK JP
      - name: Exercise public workflow with fixture approvals
        run: >-
          python tests/smoke_public_workflow.py
          --work "${{ runner.temp }}/public-smoke"
          --font /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          --font-family 'Noto Sans CJK JP'
